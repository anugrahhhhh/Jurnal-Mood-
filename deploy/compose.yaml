# Deploy produksi: Caddy (HTTPS otomatis) -> aplikasi -> PostgreSQL, plus backup harian.
# Jalankan dari folder deploy/:   docker compose --env-file .env.prod up -d --build
# Panduan lengkap: docs/DEPLOY.md

name: moodjournal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodjournal
      POSTGRES_USER: moodjournal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env.prod}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodjournal -d moodjournal"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://moodjournal:${DB_PASSWORD}@db:5432/moodjournal?sslmode=disable
      APP_ENV: production
      REGISTRATION: ${REGISTRATION:-open}
      # Aplikasi hanya bisa dijangkau lewat Caddy, jadi X-Forwarded-For dari Caddy dipercaya.
      TRUST_PROXY: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      MIN_AGE: ${MIN_AGE:-18}
    volumes:
      - ../config/crisis.yaml:/app/config/crisis.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Tidak ada "ports": aplikasi tidak terbuka ke internet secara langsung.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # Menunggu app sehat (= migrasi selesai), agar backup pertama tidak kosong.
    depends_on:
      app:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: moodjournal
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: moodjournal
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    # Satu backup per hari (format custom pg_dump), disimpan BACKUP_KEEP_DAYS hari.
    # Catatan & aktivitas di dalamnya tetap terenkripsi; mood, tidur, dan email tidak.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        while true; do
          f=/backups/moodjournal-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup: $$f"; else rm -f "$$f.tmp"; echo "backup GAGAL"; fi
          find /backups -name 'moodjournal-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
